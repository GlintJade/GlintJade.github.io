  list:
    - type: id_intern
      project_name: "IPP 기업실습 - 웹 시스템 유지보수"
      project_excerpt: "Spring·JSP 웹 시스템에 새 구분 키값을 반영하고, 집계 쿼리의 조회 시간을 0.4초에서 0.1초로 줄였습니다."
      date: "2025-08 ~ 2026-02"
      post: |
        ### 실습 소개

        IPP 기업실습으로 운영 중인 웹 시스템의 유지보수에 참여했습니다. Spring과 JSP로 만들어진 기존 코드 구조를 파악한 뒤, 데이터를 구분하는 키값 2개가 새로 추가되면서 이를 시스템 전반에 반영하는 작업을 맡았습니다.

        ### 역할

        - 여러 화면에 새 키값으로 데이터를 걸러 보는 드롭다운박스를 추가하고, 새 화면 3~4개를 만들었습니다.
        - 드롭다운과 조회에 필요한 API를 추가하고 프론트(JSP) 화면과 연결했습니다.
        - 외부에서 수신되는 데이터를 확인하고, 기존 SQL문에 새 키값에 대한 JOIN과 조건을 추가했습니다.
        - Quartz 기반 알람 배치 프로그램에서 메일 수신자를 새 키값 기준으로 구분해, 이벤트 발생 시 해당 사용자에게 메일이 가도록 수정했습니다.
        - 개발 서버의 데이터를 운영 서버로 마이그레이션했습니다.

        ### 집계 쿼리 개선 (0.4초 → 0.1초)

        거의 같은 SELECT문을 조건만 바꿔 여러 번 반복하고, 그 결과를 많은 수의 JOIN으로 잇는 쿼리가 있었습니다. 여기에 새 키값 JOIN까지 더하면 성능 문제가 커질 것이라 판단했습니다.

        - 반복되던 SELECT문을 하나로 합쳐 데이터를 한 번만 읽도록 했습니다.
        - 여러 번의 JOIN을 CASE WHEN과 집계함수(SUM, MAX)로 대체해 JOIN 수를 크게 줄였습니다.

        그 결과 조회 시간이 0.4초에서 0.1초로 줄었습니다.

        [자세한 글 보기](/ko/2026-02-27-ipp-internship)

    - type: id_team
      project_name: "MovieTalk"
      project_excerpt: "영화 취향을 공유하는 캡스톤 웹 서비스에서 마이페이지, 플레이리스트, 친구 찾기 백엔드를 구현했습니다."
      img: ":movietalk.png"
      img_title: "img title1"
      date: "2025-03 ~ 2025.06"
      post: |
        ### 프로젝트 소개

        영화 정보를 검색하고, 좋아하는 영화를 모아 다른 사용자와 취향을 공유하는 웹 서비스입니다. 4인 캡스톤 팀에서 React, Spring Boot, MySQL로 개발했습니다.

        ### 역할

        - 팀장으로 참여해 UI를 구상하고 최종 발표를 맡았습니다.
        - 마이페이지의 커스텀 영화제와 플레이리스트에 등록·조회·수정·삭제 기능을 구현했습니다.
        - 친구 찾기에서 다른 사용자의 즐겨찾기 영화 목록을 조회하는 기능을 구현하고, React 화면과 백엔드 API를 연동했습니다.

        [팀 저장소](https://github.com/MOVlETALK/MovieTalk) · [내 커밋](https://github.com/MOVlETALK/MovieTalk/commits/main/?author=GlintJade)

    - type: id_team
      project_name: "인사 관리 시스템"
      project_excerpt: "Spring과 JDBC로 직원·근태·급여 기능을 구현하고, Oracle 트리거로 급여 데이터 처리를 자동화했습니다."
      img: ":hrms.png"
      img_title: "인사 관리 대시보드"
      date: "2024-10 ~ 2024-12"
      post: |
        ### 프로젝트 소개

        직원 정보, 출퇴근 기록, 급여를 한곳에서 관리하는 3인 데이터베이스프로그래밍 팀 프로젝트입니다. 2024년 10월 17일부터 12월 5일까지 Oracle, Spring Framework, JDBC, React로 개발했습니다. 출퇴근 시간이나 인센티브를 입력하면 근무 시간과 월급이 저장 프로시저와 트리거로 자동 계산되도록 설계했습니다.

        ### 역할

        - DB 설계에 참여해 릴레이션 스키마를 작성하고, Oracle 개발 환경 구축에 참여했습니다.
        - Spring과 JDBC로 직원 등록·조회, 부서별 직원 조회, 출퇴근 등록·조회, 급여 조회와 인센티브 등록 API를 구현했습니다.
        - 프론트엔드와 연동하기 전에 입력과 조회 흐름을 확인할 수 있도록 임시 Thymeleaf 화면을 만들었습니다.
        - 보고서와 회의록 전체를 검토하고 보완했습니다.

        ### 직원 등록과 급여 데이터 연결

        직원과 급여는 1:1 관계라 직원만 등록되면 참조 무결성이 깨집니다. 직원이 등록되면 직급별 급여를 가져와 기본급과 연봉(기본급 × 12)을 계산해 급여 레코드를 만드는 `INSERT_EMPLOYEE_CREATEPAY` 트리거를 작성했습니다.

        ![INSERT_EMPLOYEE_CREATEPAY 트리거](/assets/img/posts/hrms-trigger-createpay.png)

        인센티브가 등록되면 기본급에 인센티브를 더해 직원의 월급을 갱신하는 `UPDATE_EMPLOYEE_MONTHPAY` 트리거도 구현했습니다. 인센티브가 없는 경우는 `NVL`로 0을 넣어 처리했습니다.

        ![UPDATE_EMPLOYEE_MONTHPAY 트리거](/assets/img/posts/hrms-trigger-monthpay.png)

        ### 트리거 동작 확인

        웹에서 직원 201을 등록하자, 급여 테이블에 직원 201의 급여 데이터(PAY_ID 263, 기본급 3,500,000원, 연봉 42,000,000원)가 자동으로 추가되었습니다.

        ![직원 등록 화면](/assets/img/posts/hrms-employee-register.png)

        ![등록 후 급여 테이블](/assets/img/posts/hrms-pay-after.png)

        [자세한 글 보기](/ko/2024-12-05-hr-management-system) · [GitHub 작업 브랜치](https://github.com/haeing0v0/DBP_4Team/tree/back_mk) · [내 커밋](https://github.com/haeing0v0/DBP_4Team/commits/back_mk/?author=GlintJade)

    - type: id_team
      project_name: "불법 주정차 번호판 인식 시스템"
      project_excerpt: "영상 속 차량 번호판을 읽고, 인식 기록을 날짜별로 조회하는 Python 프로그램입니다."
      img: ":license-plate.jpg"
      img_title: "번호판 탐지 결과"
      date: "2024-09 ~ 2024-12"
      post: |
        ### 프로젝트 소개

        주정차 관리에 활용할 수 있도록 영상에서 번호판 이미지를 추출하고, EasyOCR로 문자를 읽어 기록을 조회하는 4인 팀 프로젝트입니다. 2024년 9월 23일부터 12월 8일까지 Python, YOLOv5, EasyOCR, PyQt5, Oracle로 개발했습니다.

        YOLOv5 모델이 영상에서 번호판을 찾아 잘라내면, EasyOCR이 번호를 읽어 인식 시각과 함께 Oracle DB에 저장합니다.

        ### 역할

        - 번호판 탐지 모델 학습에 사용할 데이터셋을 찾았습니다. 모델 학습은 팀원이 맡았습니다.
        - 학습된 모델을 적용한 뒤, 추출된 번호판 이미지에서 문자를 더 정확히 읽을 수 있도록 인식 과정을 개선했습니다.
        - Python으로 날짜를 선택하면 해당 날짜의 번호판 기록을 조회할 수 있는 GUI를 구현했습니다.

        ### 두 줄 번호판 인식 순서 개선

        EasyOCR은 글자 영역을 찾은 순서대로 결과를 돌려주기 때문에, 두 줄 번호판은 번호 순서가 뒤섞일 수 있었습니다. 가장 위에 있는 영역을 먼저 두고, 나머지는 왼쪽부터 정렬해 이어 붙이도록 바꿨습니다.

        ![EasyOCR 문자 인식 코드](/assets/img/posts/lp-ocr-code.png)

        ### 날짜별 조회 GUI

        PyQt5 달력에서 날짜를 고르면 Oracle DB에서 그날 인식된 번호와 시각을 불러와 표로 보여줍니다.

        ![날짜 선택 화면](/assets/img/posts/lp-calendar.png)

        ![조회 결과 화면](/assets/img/posts/lp-result.png)

        ### 시연

        최종 발표에서 이미지와 영상 입력으로 번호판을 인식하는 결과를 시연했습니다.

        [자세한 글 보기](/ko/2024-12-08-license-plate-recognition)

    - type: id_personal
      project_name: "Quiznote"
      project_excerpt: "공부한 내용을 기억에서 꺼내 보는 백지복습 앱을 기획하고 Codex와 프로토타입을 만들었습니다."
      post: |
        ### 만든 이유

        공부한 내용을 다시 읽는 것과, 자료를 덮고 내 말로 설명하는 것은 다른 경험입니다. 오늘 배운 내용을 스스로 떠올리고, 어디를 틀렸거나 빠뜨렸는지 확인할 수 있는 도구를 만들고 싶었습니다.

        ### 기획한 복습 흐름

        1. 자료를 덮고 오늘 공부한 내용을 기억나는 대로 설명합니다.
        2. 앱이 어떤 개념을 설명했는지 파악하고, 틀리거나 빠진 부분을 짚어줍니다.
        3. 설명한 개념을 다시 떠올릴 수 있도록 연습 문제를 만들어 추천합니다.

        ### 역할

        복습에서 해결하고 싶은 문제를 정하고 앱의 사용 흐름을 구상했습니다. 코드 구현은 Codex의 도움을 받아 진행했습니다.
